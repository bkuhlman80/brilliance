<svg xmlns="http://www.w3.org/2000/svg" width="890" height="584" viewBox="14 0 890 584" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="14" y="0" width="890" height="584" fill="#fbfaf7"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a6d3b"/>
    </marker>
  </defs>

  <g font-size="12" fill="#6b6b6b" text-anchor="middle">
    <text x="115" y="24">stage 0 · prework</text>
    <text x="115" y="40" font-size="11">1 slot</text>
    <text x="335" y="24">stage 1 · genetic</text>
    <text x="335" y="40" font-size="11">+2 = 3 slots</text>
    <text x="555" y="24">stage 2 · nemetic</text>
    <text x="555" y="40" font-size="11">+4 = 7 slots</text>
    <text x="795" y="24">stage 3 · symbolic (and digital)</text>
    <text x="795" y="40" font-size="11">+8 = 15 slots</text>
  </g>

  <!-- solid edges: slot -> slot + newborn function -->
  <g stroke="#9a9a9a" stroke-width="1.4" fill="none">
    <path d="M200,300 C230,300 240,380 250,380"/>
    <path d="M420,236 C445,236 455,246 470,246"/>
    <path d="M200,300 C300,300 400,370 470,370"/>
    <path d="M420,380 C445,380 455,494 470,494"/>
    <path d="M200,300 C330,300 560,132 705,132"/>
    <path d="M420,236 C520,236 600,192 705,192"/>
    <path d="M420,380 C540,380 620,252 705,252"/>
    <path d="M640,122 C675,122 685,312 705,312"/>
    <path d="M640,246 C680,246 690,432 705,432"/>
    <path d="M640,370 C680,370 690,372 705,372"/>
    <path d="M645,494 C680,494 690,492 705,492"/>
  </g>
  <!-- dashed edges: the newborn function splits off from the center -->
  <g stroke="#8a6d3b" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#arr)">
    <path d="M200,300 C225,300 235,236 248,236"/>
    <path d="M420,380 C445,380 455,122 468,122"/>
    <path d="M645,494 C690,494 700,72 703,72"/>
  </g>

  <g font-size="12" text-anchor="middle">
    <!-- stage 0 -->
    <rect x="30" y="278" width="170" height="44" rx="8" fill="#e8e8e8" stroke="#8c8c8c"/>
    <text x="115" y="296" font-weight="600" fill="#222">Process → Effector</text>
    <text x="115" y="313" fill="#555">E · center at stage 0</text>

    <!-- stage 1 -->
    <rect x="250" y="214" width="170" height="44" rx="8" fill="#dbe7f3" stroke="#5b86b3"/>
    <text x="335" y="232" font-weight="600" fill="#222">Regulator</text>
    <text x="335" y="249" fill="#555">R · splits off from E</text>

    <rect x="250" y="358" width="170" height="44" rx="8" fill="#dbe7f3" stroke="#5b86b3"/>
    <text x="335" y="376" font-weight="600" fill="#222">Body → Controller</text>
    <text x="335" y="393" fill="#555">E×R · center at stage 1</text>

    <!-- stage 2 -->
    <rect x="470" y="100" width="170" height="44" rx="8" fill="#dcebd9" stroke="#5e9c58"/>
    <text x="555" y="118" font-weight="600" fill="#222">Learner</text>
    <text x="555" y="135" fill="#555">Le · splits off from E×R</text>

    <rect x="470" y="224" width="170" height="44" rx="8" fill="#dcebd9" stroke="#5e9c58"/>
    <text x="555" y="242" font-weight="600" fill="#222">Anticipator</text>
    <text x="555" y="259" fill="#555">R×Le</text>

    <rect x="470" y="348" width="170" height="44" rx="8" fill="#dcebd9" stroke="#5e9c58"/>
    <text x="555" y="366" font-weight="600" fill="#222">Connector</text>
    <text x="555" y="383" fill="#555">E×Le</text>

    <rect x="465" y="472" width="180" height="44" rx="8" fill="#dcebd9" stroke="#5e9c58"/>
    <text x="555" y="490" font-weight="600" fill="#222">Workspace → Conservator</text>
    <text x="555" y="507" fill="#555">E×R×Le · center at stage 2</text>

    <!-- stage 3 -->
    <rect x="705" y="50" width="180" height="44" rx="8" fill="#f6e3cf" stroke="#c98a3f"/>
    <text x="795" y="68" font-weight="600" fill="#222">Member</text>
    <text x="795" y="85" fill="#555">Me · splits off from E×R×Le</text>

    <rect x="705" y="110" width="180" height="44" rx="8" fill="#f6e3cf" stroke="#c98a3f"/>
    <text x="795" y="128" font-weight="600" fill="#222">Starter</text>
    <text x="795" y="145" fill="#555">E×Me</text>

    <rect x="705" y="170" width="180" height="44" rx="8" fill="#f6e3cf" stroke="#c98a3f"/>
    <text x="795" y="188" font-weight="600" fill="#222">Operator</text>
    <text x="795" y="205" fill="#555">R×Me</text>

    <rect x="705" y="230" width="180" height="44" rx="8" fill="#f6e3cf" stroke="#c98a3f"/>
    <text x="795" y="248" font-weight="600" fill="#222">Herald</text>
    <text x="795" y="265" fill="#555">E×R×Me</text>

    <rect x="705" y="290" width="180" height="44" rx="8" fill="#f6e3cf" stroke="#c98a3f"/>
    <text x="795" y="308" font-weight="600" fill="#222">Adapter</text>
    <text x="795" y="325" fill="#555">Le×Me</text>

    <rect x="705" y="350" width="180" height="44" rx="8" fill="#f6e3cf" stroke="#c98a3f"/>
    <text x="795" y="368" font-weight="600" fill="#222">Tester</text>
    <text x="795" y="385" fill="#555">E×Le×Me</text>

    <rect x="705" y="410" width="180" height="44" rx="8" fill="#f6e3cf" stroke="#c98a3f"/>
    <text x="795" y="428" font-weight="600" fill="#222">Counselor</text>
    <text x="795" y="445" fill="#555">R×Le×Me</text>

    <rect x="705" y="470" width="180" height="44" rx="8" fill="#f6e3cf" stroke="#c98a3f"/>
    <text x="795" y="488" font-weight="600" fill="#222">Translator</text>
    <text x="795" y="505" fill="#555">E×R×Le×Me · center at stage 3</text>
  </g>

  <g font-size="11" fill="#7a5a2a" font-style="italic" text-anchor="middle">
    <text x="459" y="538">each birth renames the old center: Process → Effector, Body → Controller, Workspace → Conservator · pairs have ages, not positions</text>
  </g>

  <g font-size="11" fill="#555">
    <line x1="30" y1="562" x2="70" y2="562" stroke="#9a9a9a" stroke-width="1.4"/>
    <text x="78" y="566">slot → slot + newborn function</text>
    <line x1="290" y1="562" x2="330" y2="562" stroke="#8a6d3b" stroke-width="1.8" stroke-dasharray="6 4"/>
    <text x="338" y="566">the newborn function splits off from the center</text>
  </g>
</svg>
